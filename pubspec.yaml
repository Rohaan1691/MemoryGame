name: memorygame
description: "MultiMatch Flag Challenge"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  fluttertoast: ^9.1.0
  provider: ^6.1.5+1
  responsive_grid_list: ^1.4.1
  audioplayers: ^6.7.0
  dotted_border: ^3.1.0
  vibration: ^3.1.8
  sign_in_with_apple: ^8.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/audios/
    - assets/ind.html